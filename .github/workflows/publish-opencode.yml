name: Publish OpenCode plugin

# Pull requests run the checks only. An opencode-v* tag also publishes the
# version to npm through trusted publishing.
on:
  pull_request:
    paths:
      - .github/workflows/publish-opencode.yml
      - plugins/opencode/**
  push:
    tags: ["opencode-v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Typecheck
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run typecheck

      - name: Check package contents
        run: |
          set -euo pipefail
          files=$(npm pack --dry-run --json | jq -r '.[0].files[].path')
          skills=$(ls skills/*/SKILL.md 2>/dev/null) || { echo "Package has no skills"; exit 1; }
          for f in src/index.ts README.md LICENSE package.json $skills; do
            echo "$files" | grep -qx "$f" || { echo "Package is missing $f"; exit 1; }
          done

  publish:
    name: Publish to npm
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/opencode-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-opencode
      cancel-in-progress: false
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          if [ "${TAG#opencode-v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version"
            exit 1
          fi

      # No install: the package has no runtime dependencies, and publishing only packs files.
      - name: Publish to npm
        run: npm publish --provenance --access public
